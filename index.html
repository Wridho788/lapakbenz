    .news-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin: 0 0 12px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-date-info,
    .news-time-info {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .news-icon {
      font-size: 12px;
      color: #666;
    }

    .news-date,
    .news-time {
      font-size: 12px;
      color: #666;
    }

    /* Product Tabs - matching ProductTabs.css */
    .product-tabs {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .tab-headers {
      display: flex;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }

    .tab-header {
      flex: 1;
      padding: 16px 12px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-header.active {
      color: #161129;
      background: white;
    }

    .tab-header.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #161129;
    }

    .tab-content {
      padding: 20px 16px;
      min-height: 280px;
      background: white;
      position: relative;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 100%;
      padding: 0;
      align-items: start;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid #f0f0f0;
      height: auto;
      min-height: 200px;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .product-card-image {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
      background: #f8f8f8;
    }

    .product-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-card-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .product-card-rating .star {
      font-size: 12px;
      color: #ddd;
    }

    .product-card-rating .star.filled {
      color: #ffd700;
    }

    .product-card-rating .star.half {
      color: #ffd700;
    }

    .product-card-rating .rating-number {
      font-size: 10px;
      color: #666;
      margin-left: 2px;
    }

    .product-card-name {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin: 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      height: 2.6em;
    }

    .product-card-price {
      font-size: 14px;
      font-weight: 700;
      color: #161129;
      margin-top: 4px;
    }

    /* Chapters */
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .chapter-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
    }

    .chapter-stats {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .chapter-stats span {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    /* News */
    .news-grid {
      display: grid;
      gap: 1.5rem;
    }

    .news-card {
      display: flex;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .news-image {
      font-size: 2rem;
      margin-right: 1rem;
    }

    .news-meta {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    /* CTA */
    .cta-section {
      background: linear-gradient(135deg, #161129 0%, #667eea 100%);
      color: white;
      border-radius: 15px;
      padding: 3rem;
      text-align: center;
      margin: 3rem 0;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .cta-primary,
    .cta-secondary {
      padding: 1rem 2rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.3s ease;
    }

    .cta-primary {
      background: white;
      color: #161129;
    }

    .cta-secondary {
      background: transparent;
      color: white;
      border: 2px solid white;
    }

    .cta-primary:hover,
    .cta-secondary:hover {
      transform: translateY(-3px);
    }

    /* General */
    .seo-fallback a {
      color: #007bff;
      text-decoration: none;
    }

    .seo-fallback a:hover {
      text-decoration: underline;
    }

    .seo-fallback footer {
      margin-top: 3rem;
      text-align: center;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 2rem;
    }

    /* UserCard Responsive - matching UserCard.css */
    @media (max-width: 430px) {
      .user-card {
        padding: 1.25rem;
      }

      .user-card-points {
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .point-label {
        font-size: 0.9rem;
      }

      .point-value {
        font-size: 1.75rem;
      }

      .point-image {
        width: 110px;
        height: 10vh;
      }

      .user-card-divider {
        margin-bottom: 1.25rem;
      }

      .user-card-buttons {
        gap: 0.5rem;
      }

      .user-card-button {
        padding: 0.75rem 0.25rem;
        min-height: 70px;
      }

      .button-icon {
        width: 28px;
        height: 28px;
        font-size: 1rem;
      }

      .button-label {
        font-size: 0.65rem;
      }
    }

    /* Alternative layout for very small screens */
    @media (max-width: 320px) {
      .user-card-buttons {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .user-card-button {
        padding: 1rem 0.5rem;
        min-height: 80px;
      }

      .button-icon {
        width: 32px;
        height: 32px;
        font-size: 1.2rem;
      }

      .button-label {
        font-size: 0.75rem;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {

      .user-card,
      .user-card-button,
      .button-icon,
      .point-value {
        transition: none;
      }

      .user-card:hover,
      .user-card-button:hover {
        transform: none;
      }

      .user-card-button:hover .button-icon {
        transform: none;
      }
    }

    /* Focus states for keyboard navigation */
    .user-card-button:focus {
      outline: 2px solid rgba(255, 255, 255, 0.5);
      outline-offset: 2px;
    }

    .user-card-button:focus:not(:focus-visible) {
      outline: none;
    }

    /* Partnership Responsive - matching Partnership.css */
    @media (max-width: 430px) {
      .partnership {
        padding-bottom: 0.1rem;
      }

      .partnership-slider {
        width: 95%;
        height: 140px;
      }

      .partnership-slide {
        padding: 1px;
      }

      .slider-dots {
        gap: 6px;
        margin-top: 1rem;
      }

      .slider-dot {
        width: 8px;
        height: 8px;
      }

      .slider-dot.active {
        transform: scale(1.4);
        box-shadow:
          0 0 0 2px rgba(22, 17, 41, 0.2),
          0 2px 6px rgba(22, 17, 41, 0.3);
      }
    }

    @media (max-width: 320px) {
      .partnership-slider {
        width: 98%;
        height: 120px;
      }

      .partnership-slide {
        padding: 1px;
      }

      .slider-dots {
        gap: 5px;
      }

      .slider-dot {
        width: 6px;
        height: 6px;
      }
    }

    /* Partnership Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .partnership-slides {
        transition: none;
      }

      .slider-dot,
      .slider-dot.active,
      .slider-dot:hover {
        transition: none;
        transform: none;
      }
    }

    /* Partnership Focus states */
    .slider-dot:focus {
      outline: 2px solid #161129;
      outline-offset: 4px;
    }

    .slider-dot:focus:not(:focus-visible) {
      outline: none;
    }

    /* Product Tabs Responsive */
    @media (max-width: 480px) {
      .tab-header {
        padding: 14px 8px;
        font-size: 13px;
      }

      .tab-content {
        padding: 16px 12px;
        min-height: 260px;
      }

      .products-grid {
        gap: 12px;
      }

      .product-card-image {
        height: 100px;
      }

      .product-card-name {
        font-size: 12px;
      }

      .product-card-price {
        font-size: 13px;
      }
    }

    @media (max-width: 320px) {
      .products-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    @media (max-width: 768px) {
      .seo-fallback {
        padding: 1rem;
      }

      .partnership-grid {
        grid-template-columns: 1fr;
      }

      .chapter-grid {
        grid-template-columns: 1fr;
      }

      .cta-buttons {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>

  <script type="module" src="/src/main.tsx"></script>
  <!-- OneSignal is initialized via React hook in src/hooks/useOneSignal.ts -->
